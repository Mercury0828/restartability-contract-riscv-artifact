# EW_AF_r56 - early-write suite (two duplicate lanes, remote reader).
#
# Hart 0 runs the FAULTING program: lanes 2 and 3 (a, b) are written EARLY (K2=5, K3=6) before the
# store to lane 1 (x7, outside the PMP region) traps; the handler widens the PMP entry and returns,
# the faulting store replays (F1), and lanes 2 and 3 are written AGAIN with the same values (D2, D3).
# Hart 1 reads lane 2 then lane 3 with no ordering. Tested outcome: (a, b) = (5, 6).
arch = "RISCV"
name = "EW_AF_r56"
symbolic = ["a", "b"]

[thread.0]
init = { pc_reset_address = "0x0000000080100000", x16 = "a", x17 = "b" }
code = """
	csrw pmpaddr0, x29
	csrw pmpcfg0, x30
	csrw mepc, x28
	mret
	addi x22, x0, 5
	addi x23, x0, 6
	sw x22,0(x16)
	sw x23,0(x17)
	sw x5,0(x7)
	sw x22,0(x16)
	sw x23,0(x17)
"""

[thread.1]
init = { pc_reset_address = "0x0000000080110000", x21 = "a", x24 = "b" }
code = """
	lw x18,0(x21)
	lw x19,0(x24)
"""

[section.mhandler]
address = "0x0000000080200000"
code = """
	lui t6, 0x21000
	addi t6, t6, -1
	csrw pmpaddr0, t6
	addi x1, x0, 0x2A
	mret
"""

[final]
expect = "sat"
assertion = "1:x18 = 5 & 1:x19 = 6 & 0:x1 = 0x000000000000002A"
