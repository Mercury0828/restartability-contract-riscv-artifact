# FT01 instance e - MP with the trap AFTER both producer stores.
#
# Template FT01. Axis varied: the POSITION of the trap boundary (the mirror of instance d). Both
# DATA and FLAG are po-BEFORE the faulting store, so again no trap boundary sits between them.
# Together with instance d this brackets the reference instance: trap present but before / trap
# present but after / trap present and BETWEEN (the reference). Only the last has a trap boundary
# in the ordering-relevant slot.
arch = "RISCV"
name = "FT01_e_trap_after_both"
symbolic = ["x", "y"]

[thread.0]
init = { pc_reset_address = "0x0000000080100000", x16 = "x", x17 = "y" }
code = """
	csrw pmpaddr0, x29
	csrw pmpcfg0, x30
	csrw mepc, x28
	mret
	sw x5,0(x16)
	sw x5,0(x17)
	sw x5,0(x7)
"""

[thread.1]
init = { pc_reset_address = "0x0000000080110000", x20 = "y", x21 = "x" }
code = """
	lw x18,0(x20)
	fence rw,rw
	lw x19,0(x21)
"""

[section.mhandler]
address = "0x0000000080200000"
code = """
	lui t6, 0x21000
	addi t6, t6, -1
	csrw pmpaddr0, t6
	addi x1, x0, 0x2A
	mret
"""

[final]
expect = "sat"
assertion = "1:x18 = 1 & 1:x19 = 0"
