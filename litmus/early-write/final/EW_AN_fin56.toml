# EW_AN_fin56 - early-write suite, final memory (no load of a or b; see gen_final.py).
#
# Tested final memory: *a = 5 & *b = 6.
# Hart 0 runs the TRAP-FREE program: the PMP entry already covers lane 1, so the store does not
# fault, and lanes 1, 2, 3 are each written ONCE (F1, W2=5, W3=6).
arch = "RISCV"
name = "EW_AN_fin56"
symbolic = ["a", "b"]

[thread.0]
init = { pc_reset_address = "0x0000000080100000", x16 = "a", x17 = "b", x29 = "0x0000000020FFFFFF" }
code = """
	csrw pmpaddr0, x29
	csrw pmpcfg0, x30
	csrw mepc, x28
	mret
	addi x22, x0, 5
	addi x23, x0, 6
	sw x5,0(x7)
	sw x22,0(x16)
	sw x23,0(x17)
"""

[section.mhandler]
address = "0x0000000080200000"
code = """
	lui t6, 0x21000
	addi t6, t6, -1
	csrw pmpaddr0, t6
	addi x1, x0, 0x2A
	mret
"""

[final]
expect = "sat"
assertion = "*a = 5 & *b = 6"
