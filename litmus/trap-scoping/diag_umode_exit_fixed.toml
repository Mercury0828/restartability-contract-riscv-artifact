# Minimal no-fault U-mode diagnostic that TERMINATES (fixed form of diag_umode_exit.toml).
# Preamble programs PMP entry 0 to ALLOW the region (RWX), mret to User at 0x80100010, one benign
# addi, then fall into trailing 0x0000 -> model exit. No fault, no data memory access.
# Two fixes vs the OOM baseline (see model/M3_trap_umode_2026-07-24.md):
#   (1) x28/x29/x30 are seeded CONCRETE via [registers.defaults] in the config, NOT here in `init`.
#       A litmus-`init` GPR is a SYMBOLIC constant; `csrw pmpcfg0,x30` then feeds pmpWriteCfgReg a
#       symbolic value that legalizes 8 sub-bytes, each forking at pmp/pmp_regs.sail:109 -> 8-deep
#       exponential fork tower -> OOM. Concrete defaults legalize with zero forks.
#   (2) the register assertion literal is written full-width (0x00..002A); a bare 0x2A is width-
#       inferred to 8 bits and z3 rejects the 64-vs-8 sort mismatch.
# Config: riscv64_g2_trap_umode_defaults.toml.  Verdict: diag-umode-exit allowed (3 of 3) ~98ms.
arch = "RISCV"
name = "diag-umode-exit"
symbolic = ["x"]

[thread.0]
init = { pc_reset_address = "0x0000000080100000" }
code = """
	csrw pmpaddr0, x29
	csrw pmpcfg0, x30
	csrw mepc, x28
	mret
	addi x1, x0, 0x2A
"""

[final]
expect = "sat"
assertion = "0:x1 = 0x000000000000002A"
