# Copy of riscv64_g2_pmp.toml with mtvec added to [registers.defaults] (trap-path scoping).
#
# WHY mtvec is set HERE and not in the litmus `reset = {...}`:
#   In the regenerated rv64d.ir the `reset_registers` builtin (zisla_reset_registers)
#   is invoked ONLY inside zisla_footprint_no_init (the footprint path). The axiomatic
#   litmus flow runs zmain/zloop and NEVER calls it, so BOTH the config [registers.reset]
#   AND the per-thread litmus `reset = {"mtvec.bits"=...}` are silently ignored. Only
#   [registers.defaults] (seeded directly into the register file at frame setup) takes
#   effect. Without a concrete mtvec the trap vector is symbolic -> symbolic handler PC
#   -> the fetch/phys_access_check path forks and times out (the "PMA" symptom the prior
#   scout saw was this symbolic PC, NOT a symbolic pma_regions table, which is concrete).
#
# NOTE: mtvec here hard-codes the handler address 0x80200000 (matches [section.mhandler]
#   in trap_ecall_working.toml). A per-litmus mtvec would be cleaner but is not possible
#   in this snapshot until zmain calls reset_registers (source/snapshot change).
pc = "PC"
comment_prefixes = ["#", "//"]
zero_announce_exit = true
default_sizeof = 4
in_program_order = ["sail_barrier"]

[[toolchain]]
name = "macos-riscv64"
os = "macos"
arch = "aarch64"
assembler = "riscv64-elf-as"
objdump = "riscv64-elf-objdump"
nm = "riscv64-elf-nm"
linker = "riscv64-elf-ld"

[[toolchain]]
name = "default"
assembler = "riscv64-linux-gnu-as -march=rv64imac"
objdump = "riscv64-linux-gnu-objdump"
linker = "riscv64-linux-gnu-ld"
nm = "riscv64-linux-gnu-nm"

[mmu]
page_table_base = "0x300000"
page_size = "4096"
s2_page_table_base = "0x300000"
s2_page_size = "4096"

[threads]
base = "0x80100000"
top = "0x80300000"
stride = "0x10000"

[symbolic_addrs]
base = "0x80310000"
top = "0x80410000"
stride = "0x10"

[registers.defaults]
vstart = "0x0000000000000000"
vl = "0x0000000000000000"
vtype = "{ bits = 0x8000000000000000 }"
satp = "0x0000000000000000"
misa = "{ bits = 0x0000000000000000 }"
mstatus = "{ bits = 0x0000000000000000 }"
mtvec = "{ bits = 0x0000000080200000 }"
mcountinhibit = " { bits = 0x00000000 }"
mcyclecfg = "{ bits = 0x0000000000000000 }"
minstretcfg = "{ bits = 0x0000000000000000 }"
mtimecmp = "0x0000000000000000"
stimecmp = "0x0000000000000000"
pmpcfg_n = "[{ bits = 0x00 } ; 64]"
pmpaddr_n = "[0x0000000000000000 ; 64]"

[const_primops]
get_config_print_reg = false
get_config_print_instr = false
get_config_print_platform = false
get_config_print_mem = false
sys_enable_fdext = false
sys_enable_zfinx = false
sys_enable_rvc = true
sys_enable_next = false
sys_enable_vext = false
sys_enable_writable_fiom = true
sys_enable_writable_misa = true
sys_enable_bext = false
sys_pmp_count = "0 : %i64"
plat_enable_pmp = false
plat_enable_dirty_update = false
plat_enable_misaligned_access = false
plat_mtval_has_illegal_inst_bits = false
plat_insns_per_tick = 10
plat_ram_base = "0x0000000080000000"
plat_ram_size = "0x0000000004000000"
plat_rom_base = "0x0000000000001000"
plat_rom_size = "0x0000000000000100"
plat_clint_base = "0x0000000002000000"
plat_clint_size = "0x00000000000c0000"
plat_htif_tohost = "0x0000000040001000"
plat_get_16_random_bits = "undefined : %bv16"
plat_term_write = "()"
print_reg = "()"
print_platform = "()"
print_instr = "()"
print_mem_access = "()"
speculate_conditional = "undefined : %bool"
match_reservation = "true"
cancel_reservation = "()"
load_reservation = "()"
csr_full_write_callback = "()"
mem_read_callback = "()"
xreg_full_write_callback = "()"
mem_write_callback = "()"
mem_exception_callback = "()"
pc_write_callback = "()"
get_config_rvfi = "false"
plat_enable_htif = "false"
get_config_use_abi_names = "false"
