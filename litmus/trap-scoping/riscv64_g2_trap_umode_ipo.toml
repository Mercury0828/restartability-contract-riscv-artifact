# riscv64_g2_trap_umode_ipo.toml - S1-v2 config.
#
# EXACT COPY of riscv64_g2_trap_umode_defaults.toml (the CSR-source-seeding U-mode/PMP-fault
# config) with ONE delta: `in_program_order` is extended from ["sail_barrier"] to also list the
# three abstract trap events "sail_trap", "sail_mret", "sail_write_CSR".
#
# WHY THIS DELTA IS NECESSARY (measured, not assumed).  isla's po is
#   isla-axiomatic/src/axiomatic.rs:411-420
#     pub fn po(ev1, ev2) -> bool {
#         instruction_order(ev1, ev2)
#             && (is_memory(ev1) || ev1.in_program_order)
#             && (is_memory(ev2) || ev2.in_program_order)
#     }
# and `in_program_order` is set on an abstract event only if its name is listed in this config key
# (isla-lib/src/config.rs:561 get_in_program_order, consumed at axiomatic.rs:1021). Measured on
# rv64d_g58.ir with only "sail_barrier" listed (see model/S1v2_trap_differential_2026-07-25.md
# Step 0.3): [TRAP], [XRET] and [CSRW] are all NON-EMPTY (the tripwire fires) but every po-pair
# touching them -- [M];po;[TRAP], [TRAP];po;[XRET], [XRET];po;[M], [CSRW];po;[M] -- is EMPTY.
# So Cat-visibility of the event is NOT sufficient for po-relatedness; the event must additionally
# be declared in program order. This is the SAME mechanism the model already uses for fences
# (sail_barrier is listed for exactly this reason), so it is a config declaration, not a model
# change: no Sail source and no IR is modified.
#
# --- original header of riscv64_g2_trap_umode_defaults.toml follows verbatim ---
# SHAPE B config: U-mode + a PMP that DENIES the store target.
#
# Derived from riscv64_g2_trap.toml (mtvec default + concrete PMP) with three deltas:
#   1. cur_privilege = "User"  -> the program starts in U-mode (enum literal; z-encodes to zUser).
#   2. medeleg = "{ bits = 0 }" -> the store-access-fault is NOT delegated to S-mode; it stays M-mode
#      (medeleg has no [registers.defaults] entry otherwise and the reset path is dead, so it would be
#      symbolic and fork the delegation decision).
#   3. PMP is programmed BY THE LITMUS PREAMBLE VIA CSR WRITES, not here. Reason: reset_pmp()
#      (model/pmp/pmp_control.sail, run at model init) forces every entry's A=OFF and L=0, keeping only
#      the R/W/X bits -- probe-confirmed: a config default of pmpcfg 0x1F (A=NAPOT|RWX) is stomped to
#      0x07 (A=OFF) -> PMP_NoMatch -> the region never matches. So the config leaves pmpcfg_n/pmpaddr_n
#      = 0 and the U-mode litmus's M-mode preamble does `csrw pmpaddr0,<napot>; csrw pmpcfg0,0x1F`
#      (the standard firmware pattern; a post-reset CSR write of A=NAPOT is NOT stripped) to install a
#      single NAPOT entry 0 = [0x80000000,0x84000000) RWX. A U-mode access inside it matches entry 0;
#      one outside hits the pmpCheck `priv != Machine` default-deny -> E_SAMO_Access_Fault.
#
#   NAPOT region math: base=0x80000000, size=2^26=64MB -> pmpaddr = (base>>2)|(2^(26-3)-1)
#   = 0x20000000 | 0x7FFFFF = 0x207FFFFF ; decodes to [0x80000000, 0x84000000). Covers the thread code
#   (0x80100000), the handler (0x80200000), and a good-store target in RAM; the fault target 0x84001000
#   is PMA-valid main memory JUST ABOVE the region, so PMA allows and PMP is the SOLE fault cause.
pc = "PC"
comment_prefixes = ["#", "//"]
zero_announce_exit = true
default_sizeof = 4
# THE ONLY DELTA vs riscv64_g2_trap_umode_defaults.toml (see header):
in_program_order = ["sail_barrier", "sail_trap", "sail_mret", "sail_write_CSR"]

[[toolchain]]
name = "macos-riscv64"
os = "macos"
arch = "aarch64"
assembler = "riscv64-elf-as"
objdump = "riscv64-elf-objdump"
nm = "riscv64-elf-nm"
linker = "riscv64-elf-ld"

[[toolchain]]
name = "default"
assembler = "riscv64-linux-gnu-as -march=rv64imac"
objdump = "riscv64-linux-gnu-objdump"
linker = "riscv64-linux-gnu-ld"
nm = "riscv64-linux-gnu-nm"

[mmu]
page_table_base = "0x300000"
page_size = "4096"
s2_page_table_base = "0x300000"
s2_page_size = "4096"

[threads]
base = "0x80100000"
top = "0x80300000"
stride = "0x10000"

[symbolic_addrs]
base = "0x80310000"
top = "0x80410000"
stride = "0x10"

[registers.defaults]
vstart = "0x0000000000000000"
vl = "0x0000000000000000"
vtype = "{ bits = 0x8000000000000000 }"
satp = "0x0000000000000000"
misa = "{ bits = 0x0000000000000000 }"
# mstatus.SXL=UXL=0b10 (RV64) in bits [35:34]/[33:32] -> 0xA00000000. CRITICAL for U-mode:
# translationMode() (sys/vmem.sail:247, taken for any non-Machine access) reads architecture(Supervisor)
# = mstatus[SXL]; with SXL=0 architecture_bits is invalid -> internal_error -> translateAddr returns
# arbitrary/poison on the first U-mode instruction fetch (probe-confirmed). MPP stays 00 (=User) so the
# preamble mret drops to User. The Machine-mode path returns Bare without reading SXL, which is why the
# ecall/SHAPE-A tests worked with mstatus=0.
mstatus = "{ bits = 0x0000000A00000000 }"
mtvec = "{ bits = 0x0000000080200000 }"
medeleg = "{ bits = 0x0000000000000000 }"
mideleg = "{ bits = 0x0000000000000000 }"
# mie=0 disables ALL interrupt enables. CRITICAL for U-mode: mtimecmp=0 makes mip[MTI] permanently
# pending (platform.sail:142 `mip[MTI] = mtimecmp <= mtime`), and in U-mode M-interrupts are unmaskable
# by mstatus.MIE, so without this the timer interrupt fires on every U-mode instruction -> infinite
# interrupt loop -> timeout. dispatchInterrupt gates on `mip & mie` (sys_control.sail:112), so mie=0
# (which reset_sys does NOT stomp) suppresses the loop. mtimecmp is also raised to max as defence.
mie = "{ bits = 0x0000000000000000 }"
mip = "{ bits = 0x0000000000000000 }"
cur_privilege = "User"
mcountinhibit = " { bits = 0x00000000 }"
mcyclecfg = "{ bits = 0x0000000000000000 }"
minstretcfg = "{ bits = 0x0000000000000000 }"
mtimecmp = "0xFFFFFFFFFFFFFFFF"
stimecmp = "0xFFFFFFFFFFFFFFFF"
# PMP entries left at reset (A=OFF); entry 0 is installed by the litmus preamble via CSR writes
# (reset_pmp strips the A field from any config default, so it must be written post-reset in code).
pmpcfg_n = "[{ bits = 0x00 } ; 64]"
pmpaddr_n = "[0x0000000000000000 ; 64]"
# Concrete GPR seeds (pin the values csrw writes so pmpWriteCfgReg legalizes concretely).
x28 = "0x0000000080100010"
x29 = "0x00000000207FFFFF"
x30 = "0x000000000000001F"
x5  = "0x0000000000000001"
x7  = "0x0000000084001000"

