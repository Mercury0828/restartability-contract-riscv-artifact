# FT01 instance b - MP with a real trap between the producer's two stores, LANE-SWAPPED.
#
# Template FT01 (see TEMPLATES.md). Axis varied vs the FT01 reference instance
# (litmus/trap-scoping/S1v2_trap_mp.toml): WHICH SYMBOLIC LANE carries DATA and which carries
# FLAG. Here DATA -> y and FLAG -> x (the reference has DATA -> x, FLAG -> y). Symbolic addresses
# are allocated in declaration order from 0x80310000 with stride 0x10, so this genuinely moves the
# two accesses to different physical addresses, not just different register names.
arch = "RISCV"
name = "FT01_b_lane_yx"
symbolic = ["x", "y"]

[thread.0]
init = { pc_reset_address = "0x0000000080100000", x16 = "y", x17 = "x" }
code = """
	csrw pmpaddr0, x29
	csrw pmpcfg0, x30
	csrw mepc, x28
	mret
	sw x5,0(x16)
	sw x5,0(x7)
	sw x5,0(x17)
"""

[thread.1]
init = { pc_reset_address = "0x0000000080110000", x20 = "x", x21 = "y" }
code = """
	lw x18,0(x20)
	fence rw,rw
	lw x19,0(x21)
"""

[section.mhandler]
address = "0x0000000080200000"
code = """
	lui t6, 0x21000
	addi t6, t6, -1
	csrw pmpaddr0, t6
	addi x1, x0, 0x2A
	mret
"""

[final]
expect = "sat"
assertion = "1:x18 = 1 & 1:x19 = 0"
