# FT01 instance d - MP with the trap BEFORE both producer stores.
#
# Template FT01. Axis varied: the POSITION of the trap boundary relative to the two ordered
# stores. Here the faulting store (and therefore the TRAP / handler / XRET / replay sequence) comes
# FIRST, and both DATA and FLAG are po-after the XRET. No trap boundary separates DATA from FLAG,
# so any drain-style completion that composes [M];po;[TRAP];po;[XRET];po;[M] contributes nothing
# between them. This is the positional control for FT01: it holds the trap PRESENT but moves it out
# of the ordering-relevant slot.
arch = "RISCV"
name = "FT01_d_trap_before_both"
symbolic = ["x", "y"]

[thread.0]
init = { pc_reset_address = "0x0000000080100000", x16 = "x", x17 = "y" }
code = """
	csrw pmpaddr0, x29
	csrw pmpcfg0, x30
	csrw mepc, x28
	mret
	sw x5,0(x7)
	sw x5,0(x16)
	sw x5,0(x17)
"""

[thread.1]
init = { pc_reset_address = "0x0000000080110000", x20 = "y", x21 = "x" }
code = """
	lw x18,0(x20)
	fence rw,rw
	lw x19,0(x21)
"""

[section.mhandler]
address = "0x0000000080200000"
code = """
	lui t6, 0x21000
	addi t6, t6, -1
	csrw pmpaddr0, t6
	addi x1, x0, 0x2A
	mret
"""

[final]
expect = "sat"
assertion = "1:x18 = 1 & 1:x19 = 0"
