# DG_AN_fin_a0 - diagnostic: does a final-memory assertion see hart 0's own store under the trap config?
#
# Hart 0 runs the TRAP-FREE program: the PMP entry already covers lane 1, so the store does not
# fault, and lanes 1, 2, 3 are each written ONCE (F1, W2=5, W3=6).
# Tested: hart 0 reloads a after its store (x9 = 5) and final memory *a = 0.
arch = "RISCV"
name = "DG_AN_fin_a0"
symbolic = ["a", "b"]

[thread.0]
init = { pc_reset_address = "0x0000000080100000", x16 = "a", x17 = "b", x29 = "0x0000000020FFFFFF" }
code = """
	csrw pmpaddr0, x29
	csrw pmpcfg0, x30
	csrw mepc, x28
	mret
	addi x22, x0, 5
	addi x23, x0, 6
	sw x5,0(x7)
	sw x22,0(x16)
	sw x23,0(x17)
	lw x9,0(x16)
"""

[thread.1]
init = { pc_reset_address = "0x0000000080110000", x21 = "a", x24 = "b" }
code = """
	lw x18,0(x21)
	lw x19,0(x24)
"""

[section.mhandler]
address = "0x0000000080200000"
code = """
	lui t6, 0x21000
	addi t6, t6, -1
	csrw pmpaddr0, t6
	addi x1, x0, 0x2A
	mret
"""

[final]
expect = "unsat"
assertion = "0:x9 = 0x0000000000000005 & *a = 0"
