# FT01 instance c - MP across a trap, VALUE-DISCRIMINATED producer.
#
# Template FT01. Axis varied: the DATA value. The producer writes DATA = 2 (from a freshly
# materialised x22) instead of the config-seeded 1, while FLAG stays 1. The observed outcome is
# still "FLAG seen, DATA not seen", but the DATA value is now distinguishable from both the FLAG
# value and from the initial 0, so an `allowed` verdict cannot be an artefact of the two stores
# writing the same bit pattern.
arch = "RISCV"
name = "FT01_c_val2"
symbolic = ["x", "y"]

[thread.0]
init = { pc_reset_address = "0x0000000080100000", x16 = "x", x17 = "y" }
code = """
	csrw pmpaddr0, x29
	csrw pmpcfg0, x30
	csrw mepc, x28
	mret
	addi x22, x0, 2
	sw x22,0(x16)
	sw x5,0(x7)
	sw x5,0(x17)
"""

[thread.1]
init = { pc_reset_address = "0x0000000080110000", x20 = "y", x21 = "x" }
code = """
	lw x18,0(x20)
	fence rw,rw
	lw x19,0(x21)
"""

[section.mhandler]
address = "0x0000000080200000"
code = """
	lui t6, 0x21000
	addi t6, t6, -1
	csrw pmpaddr0, t6
	addi x1, x0, 0x2A
	mret
"""

[final]
expect = "sat"
assertion = "1:x18 = 1 & 1:x19 = 0"
