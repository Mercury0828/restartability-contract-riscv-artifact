# FT03 instance c - MP across a trap with the fence placed AFTER the trap boundary.
#
# Template FT03. Axis varied: the POSITION of the fence relative to the trap. The FT03 reference
# instance puts `fence rw,rw` between DATA and the faulting store (i.e. before the trap); this one
# puts it between the REPLAYED faulting store and FLAG (i.e. after the XRET). Either placement
# still yields a fence that is po-between DATA and FLAG, so RVWMO's fence rule should close the MP
# cycle from either side - which is what makes this a genuine check that the trap/handler/replay
# sequence does not swallow the fence's ordering contribution.
arch = "RISCV"
name = "FT03_c_fence_after_trap"
symbolic = ["x", "y"]

[thread.0]
init = { pc_reset_address = "0x0000000080100000", x16 = "x", x17 = "y" }
code = """
	csrw pmpaddr0, x29
	csrw pmpcfg0, x30
	csrw mepc, x28
	mret
	sw x5,0(x16)
	sw x5,0(x7)
	fence rw,rw
	sw x5,0(x17)
"""

[thread.1]
init = { pc_reset_address = "0x0000000080110000", x20 = "y", x21 = "x" }
code = """
	lw x18,0(x20)
	fence rw,rw
	lw x19,0(x21)
"""

[section.mhandler]
address = "0x0000000080200000"
code = """
	lui t6, 0x21000
	addi t6, t6, -1
	csrw pmpaddr0, t6
	addi x1, x0, 0x2A
	mret
"""

[final]
expect = "sat"
assertion = "1:x18 = 1 & 1:x19 = 0"
